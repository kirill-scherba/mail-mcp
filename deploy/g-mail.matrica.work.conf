server {
    server_name g-mail.matrica.work;

    location / {
        proxy_pass http://127.0.0.1:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/g-mail.matrica.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/g-mail.matrica.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = g-mail.matrica.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name g-mail.matrica.work;

    listen 80;
    return 404; # managed by Certbot


}