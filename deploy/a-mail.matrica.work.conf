server {
    server_name a-mail.matrica.work;

    location /mail/inbox {
        proxy_pass http://127.0.0.1:8901/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        limit_except POST { deny all; }
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/a-mail.matrica.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/a-mail.matrica.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = a-mail.matrica.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name a-mail.matrica.work;
    return 404; # managed by Certbot


}